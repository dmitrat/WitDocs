name: Publish Package
run-name: "Publish: ${{ inputs.project || github.ref_name }}"

# Publishes ONE package. Two ways to start it:
#
#   - Run workflow (workflow_dispatch): pick the project and the feeds.
#   - Push a tag <Project>/v<Version>, for example OutWit.Docs.Generator/v2.4.2:
#     publishes that project to nuget.org and GitHub Packages. The version in the tag
#     must equal the project's <Version>, or the run stops before anything is pushed.
#
# nuget.org is reached through trusted publishing either way: the workflow's OIDC
# token is exchanged for a short-lived key (policy on nuget.org: owner dmitrat,
# repository dmitrat/WitDocs, workflow publish.yml). No API key is stored anywhere.

on:
  push:
    tags:
      - 'OutWit.Docs.*/v*'
  workflow_dispatch:
    inputs:
      project:
        description: 'Project to publish'
        required: true
        type: choice
        options:
          - OutWit.Docs.Framework
          - OutWit.Docs.Generator
          - OutWit.Docs.Templates
      pushToNuGet:
        description: 'Push to nuget.org'
        type: boolean
        required: true
        default: true
      pushToGitHubPackages:
        description: 'Push to GitHub Packages'
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  packages: write
  id-token: write   # required for NuGet trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Project, version and feeds, from the tag or from the dispatch inputs.
      - name: Resolve what to publish
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PROJECT: ${{ inputs.project }}
          INPUT_PUSH_NUGET: ${{ inputs.pushToNuGet }}
          INPUT_PUSH_GITHUB: ${{ inputs.pushToGitHubPackages }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            PROJECT="${GITHUB_REF_NAME%%/*}"
            TAG_VERSION="${GITHUB_REF_NAME##*/v}"
            PUSH_NUGET=true
            PUSH_GITHUB=true
          else
            PROJECT="$INPUT_PROJECT"
            TAG_VERSION=""
            PUSH_NUGET="$INPUT_PUSH_NUGET"
            PUSH_GITHUB="$INPUT_PUSH_GITHUB"
          fi

          PROJECT_PATH=$(find . -name "$PROJECT.csproj" -not -path "*/bin/*" -not -path "*/obj/*" | head -1)
          if [ -z "$PROJECT_PATH" ]; then
            echo "::error::Project $PROJECT.csproj not found"
            exit 1
          fi

          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$PROJECT_PATH" | head -1)
          if [ -n "$TAG_VERSION" ] && [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "::error::The tag asks for $TAG_VERSION, but $PROJECT_PATH is at $VERSION"
            exit 1
          fi

          {
            echo "project=$PROJECT"
            echo "projectPath=$PROJECT_PATH"
            echo "projectDir=$(dirname "$PROJECT_PATH")"
            echo "version=$VERSION"
            echo "pushNuGet=$PUSH_NUGET"
            echo "pushGitHub=$PUSH_GITHUB"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $PROJECT $VERSION ($PROJECT_PATH) - nuget.org: $PUSH_NUGET, GitHub Packages: $PUSH_GITHUB"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore OutWit.slnx

      - name: Test (gate publish on green tests)
        run: dotnet test OutWit.slnx -c Release --verbosity minimal

      - name: Build
        run: dotnet build "${{ steps.target.outputs.projectPath }}" -c Release -p:ContinuousIntegrationBuild=true

      - name: Pack
        run: dotnet pack "${{ steps.target.outputs.projectPath }}" -c Release --no-build

      # Only the selected project's package. Release builds pack on build
      # (GeneratePackageOnBuild), so after the test step every packable project has a
      # .nupkg under its bin/Release, and collecting all of them pushed packages
      # nobody had asked to release.
      - name: Collect packages
        id: collect
        shell: bash
        env:
          PROJECT: ${{ steps.target.outputs.project }}
          PROJECT_DIR: ${{ steps.target.outputs.projectDir }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          mkdir -p NuGet
          find "$PROJECT_DIR/bin/Release" -maxdepth 1 -name "$PROJECT.$VERSION.nupkg" -exec cp {} NuGet/ \;
          find "$PROJECT_DIR/bin/Release" -maxdepth 1 -name "$PROJECT.$VERSION.snupkg" -exec cp {} NuGet/ \;

          if [ ! -f "NuGet/$PROJECT.$VERSION.nupkg" ]; then
            echo "::error::$PROJECT.$VERSION.nupkg was not produced under $PROJECT_DIR/bin/Release"
            exit 1
          fi

          HAS_SNUPKG=$(ls NuGet/*.snupkg 2>/dev/null | wc -l)
          echo "hasSnupkg=$([[ $HAS_SNUPKG -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

          echo "Collected packages:"
          ls -la NuGet/

      - name: Add GitHub Packages source
        if: steps.target.outputs.pushGitHub == 'true'
        run: |
          dotnet nuget add source \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      # Trusted publishing (OIDC): exchanges the workflow's id-token for a short-lived
      # nuget.org API key — no long-lived secret. Requires a matching trusted-publishing
      # policy on nuget.org (owner + repo dmitrat/WitDocs + workflow publish.yml).
      - name: NuGet trusted-publishing login
        id: nugetlogin
        if: steps.target.outputs.pushNuGet == 'true'
        uses: NuGet/login@v1
        with:
          user: dmitrat   # <-- must match your nuget.org username

      - name: Push to nuget.org
        if: steps.target.outputs.pushNuGet == 'true'
        run: |
          dotnet nuget push "NuGet/*.nupkg" \
            --api-key ${{ steps.nugetlogin.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Push symbols to nuget.org
        if: steps.target.outputs.pushNuGet == 'true' && steps.collect.outputs.hasSnupkg == 'true'
        run: |
          dotnet nuget push "NuGet/*.snupkg" \
            --api-key ${{ steps.nugetlogin.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Push to GitHub Packages
        if: steps.target.outputs.pushGitHub == 'true'
        run: |
          dotnet nuget push "NuGet/*.nupkg" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source github \
            --skip-duplicate

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.target.outputs.project }}-nuget
          path: NuGet/*
          retention-days: 7
